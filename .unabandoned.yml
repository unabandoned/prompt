schema: 1

package: "@unabandoned/prompt"

upstream:
  repo: flatiron/prompt
  reason: "no release since 1.3.0 in April 2022"

summary: >-
  Interactive command-line prompt that asks for values described by a
  JSON-schema-style schema, with defaults, validation, hidden input and
  confirmation.

why-forked: >-
  CyberChef's operation generator uses it, and it was abandoned while pinning
  winston 2.x, async 3.2.3, read 1.0.x and @colors/colors 1.5.0 and carrying
  revalidator, frozen since 2014. The fork reads lines with node:readline,
  builds in a small CLI logger and colour helper, replaces async with two
  in-tree helpers and vendors revalidator, so it has no runtime dependencies.

used-by:
  - consumer: TheTechNetwork/CyberChef
    purpose: >-
      drives the interactive questions in src/core/config/scripts/newOperation.mjs
      (npm run newop), which scaffolds a new operation and its test file from
      the answers

status: active

tags: [cli, prompt, readline, interactive, validation]
